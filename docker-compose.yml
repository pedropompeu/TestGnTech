services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-gntech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gntech_pass}
      POSTGRES_DB: ${DB_NAME:-weather_db}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gntech} -d ${DB_NAME:-weather_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-gntech}:${DB_PASSWORD:-gntech_pass}@db:5432/${DB_NAME:-weather_db}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
